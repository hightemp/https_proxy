version: 2

project_name: https_proxy

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: https-proxy
    main: ./main.go
    binary: https_proxy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      # - -linkmode external -extldflags '-static'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: https-proxy
    package_name: https-proxy
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    maintainer: "hightemp <hightemp.unknown@gmail.com>"
    description: "Simple HTTP/HTTPS proxy server with basic authentication."
    license: MIT
    vendor: "hightemp"
    homepage: "https://github.com/hightemp/https_proxy"
    formats:
      - deb
      - rpm
    builds:
      - https-proxy
    bindir: /usr/bin
    contents:
      - src: config.example.yaml
        dst: /etc/https_proxy/config.yaml
        type: config
        file_info:
          mode: 0644
      - src: packaging/https_proxy.service
        dst: /lib/systemd/system/https_proxy.service
        type: config
        file_info:
          mode: 0644
    scripts:
      postinstall: "packaging/postinstall.sh"
      preremove: "packaging/preremove.sh"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |-

    ---

    Released by GoReleaser.
