proxy_addr: 127.0.0.1:9999
username: user
password: pass
proto: http
cert_path: ./cert.pem
key_path: ./key.pem
network: auto
dial_timeout: 10s
tls_handshake_timeout: 10s
response_header_timeout: 30s
read_header_timeout: 15s
idle_timeout: 2m
shutdown_timeout: 15s
